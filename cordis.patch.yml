# Bundle layer for dsh-worktree-plugin. Referenced by package.json
# `dsh.bundle.patch`; applied when a profile lists this package.
#
# Adds two Host rows from one package (dsh-superagent pattern: each row loads
# an exports subpath):
# - worktree-manager: the worktree service (list / create / enter / remove
#   worktrees + registry) and its agent tools.
# - git-review: the git review service (diff / commit / log / blame / compare
#   / push over any checkout path) and its agent tools.
# Both web surfaces (sidebar + review tab) ship in the single client bundle.
- insert:
    - id: worktree-manager
      name: dsh-worktree-plugin
      config: {}
    - id: git-review
      name: dsh-worktree-plugin/review
      config: {}
